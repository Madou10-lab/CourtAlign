[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "courtalign"
version = "1.0.0"
description = "CourtAlign-2S and CourtAlign-E2E for tennis and badminton court registration"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  {name = "Ahmed Jouini"},
  {name = "Melek Elloumi"},
  {name = "Faten Chaieb"}
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
